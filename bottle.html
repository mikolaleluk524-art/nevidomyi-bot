<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Гра в бутилочку</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg1:#1d1238;--bg2:#0e0a1c;--card:#ffffff10;--card2:#ffffff1a;--line:#ffffff22;
  --text:#fff;--muted:#cfc6e8;--faint:#9a90b8;
  --pink:#ff5fa2;--pink2:#ff8a5c;--violet:#8b5cf6;--gold:#ffd166;--blue:#5aa9ff;
  --ok:#34d399;--bad:#ff6b6b;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:radial-gradient(120% 80% at 50% 0%,#3a1d6e 0%,var(--bg1) 45%,var(--bg2) 100%) fixed;color:var(--text);
  font-family:-apple-system,"Segoe UI",Roboto,system-ui,sans-serif;font-size:16px;line-height:1.35;text-align:center;
  padding:calc(8px + env(safe-area-inset-top)) 14px calc(96px + env(safe-area-inset-bottom));overflow-x:hidden}
.wrap{max-width:440px;margin:0 auto}
button{font-family:inherit;cursor:pointer;border:0;color:inherit}
button:disabled{opacity:.45;cursor:default}
.hidden{display:none!important}

/* верх */
.top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.top h1{flex:1;text-align:left;font-size:19px;font-weight:800;letter-spacing:-.01em}
.chip{background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:14px;font-weight:600;white-space:nowrap}
.help{width:36px;height:36px;border-radius:50%;background:var(--card2);border:1px solid var(--line);font-size:17px;font-weight:800}
.event{margin:4px 0 6px;padding:9px 12px;border-radius:14px;background:linear-gradient(90deg,#ff5fa233,#8b5cf633);border:1px solid #ff5fa277;font-size:14px;font-weight:700}

/* стіл */
.table{position:relative;width:min(92vw,400px,47vh);aspect-ratio:1;margin:8px auto 10px;border-radius:50%;
  background:radial-gradient(circle at 50% 45%,#5b2a9e 0%,#3a1a6b 55%,#26124a 100%);
  box-shadow:0 0 0 6px #ffffff10,0 0 0 7px #ffffff22,0 18px 50px #000a,inset 0 0 60px #0006}
.table::after{content:"";position:absolute;inset:18%;border-radius:50%;border:2px dashed #ffffff18}
.seat{position:absolute;width:74px;transform:translate(-50%,-50%);transition:left .4s,top .4s;z-index:2}
.seat .av{width:54px;height:54px;margin:0 auto;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:29px;
  background:linear-gradient(160deg,#ffffff2a,#ffffff10);border:3px solid #ffffff55;box-shadow:0 4px 12px #0007;transition:box-shadow .3s,transform .3s}
.seat.empty .av{width:30px;height:30px;font-size:0;border:2px dashed #ffffff30;background:transparent;box-shadow:none}
.seat.m .av{border-color:var(--blue)}
.seat.f .av{border-color:var(--pink)}
.seat.me .av{outline:3px solid var(--gold);outline-offset:2px}
.seat.turn .av{animation:pulse 1.4s ease-in-out infinite}
.seat.paired .av{box-shadow:0 0 0 4px #ff5fa2aa,0 0 22px #ff5fa2;transform:scale(1.08)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 #ffd16699}50%{box-shadow:0 0 0 9px #ffd16600}}
.seat .nm{margin-top:3px;font-size:12px;font-weight:700;background:#0008;border-radius:8px;padding:1px 6px;display:inline-block;max-width:74px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seat.empty .nm{display:none}
.seat .hb{position:absolute;top:-6px;right:2px;font-size:11px;font-weight:800;background:var(--pink);color:#fff;border-radius:9px;padding:0 5px;line-height:17px}
.seat .crown{position:absolute;top:-19px;left:50%;transform:translateX(-50%);font-size:18px}
.seat .gb{position:absolute;top:30px;left:2px;font-size:17px}
.seat .hb:empty,.seat .crown:empty,.seat .gb:empty{display:none}
#bottle{position:absolute;left:50%;top:50%;width:13%;height:40%;transform:translate(-50%,-50%) rotate(0deg);filter:drop-shadow(0 8px 10px #0009);z-index:1}
.fly{position:absolute;font-size:30px;transform:translate(-50%,-50%);pointer-events:none;animation:fly 1.5s ease-out forwards;z-index:5}
@keyframes fly{to{transform:translate(-50%,-180%) scale(1.5);opacity:0}}

/* сцена: що робити зараз */
.stage{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px;backdrop-filter:blur(6px)}
.stage .title{font-size:19px;font-weight:800}
.stage .sub{font-size:14px;color:var(--muted);margin-top:4px}
.cats{display:flex;gap:6px;overflow-x:auto;margin:12px -2px 2px;padding:2px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;padding:9px 13px;border-radius:999px;background:var(--card2);border:1px solid var(--line);font-size:14px;font-weight:700}
.cat.on{background:#fff;color:#2a124e;border-color:#fff}
.big{width:100%;margin-top:12px;padding:16px;border-radius:18px;font-size:19px;font-weight:900;letter-spacing:.02em;color:#fff;
  background:linear-gradient(90deg,var(--pink),var(--pink2));box-shadow:0 8px 24px #ff5fa255}
.big:active{transform:scale(.98)}
.soft{width:100%;margin-top:8px;padding:13px;border-radius:16px;font-size:16px;font-weight:700;background:var(--card2);border:1px solid var(--line)}
.task{margin-top:10px;padding:14px;border-radius:18px;background:#fff;color:#22113f;text-align:left}
.task .tag{font-size:12px;font-weight:900;letter-spacing:.12em;color:var(--violet)}
.task .q{font-size:18px;font-weight:700;margin-top:4px;line-height:1.35}
.task .a{margin-top:10px;padding:10px 12px;border-radius:12px;background:#f3eefe;font-size:17px;font-weight:600}
.stage textarea,.sheetbox textarea{width:100%;margin-top:10px;padding:12px;border-radius:14px;border:2px solid #ffffff33;background:#0006;color:#fff;font-size:17px;font-family:inherit;resize:none}
.stage textarea:focus,.sheetbox textarea:focus{outline:none;border-color:var(--pink)}
.reacts{display:flex;gap:8px;justify-content:center;margin-top:12px}
.reacts button{flex:1;max-width:72px;font-size:26px;padding:8px 0;border-radius:16px;background:var(--card2);border:1px solid var(--line)}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.choices button{padding:14px 4px;border-radius:18px;font-size:15px;font-weight:800;background:var(--card2);border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:4px}
.choices button b{font-size:30px;font-weight:400;line-height:1}
.choices button.kiss{border-color:#ff5fa2aa}
.choices button.alone{border-color:#8b5cf6cc}
.choices button.on{background:#fff;color:#2a124e}
.wishstrip{display:block;width:100%;margin-top:10px;padding:12px 14px;border-radius:16px;text-align:left;font-size:15px;font-weight:700;
  background:linear-gradient(90deg,#ffd16633,#ff8a5c22);border:1px solid #ffd16688;color:#fff}

/* нижня панель */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  background:#120b25ee;border-top:1px solid var(--line);backdrop-filter:blur(10px)}
.tabbar .in{max-width:440px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tab{position:relative;padding:7px 2px 6px;border-radius:14px;background:transparent;font-size:12px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.tab b{font-size:24px;font-weight:400;line-height:1.1}
.tab:active{background:var(--card2)}
.badge{position:absolute;top:2px;right:calc(50% - 26px);min-width:19px;height:19px;border-radius:10px;background:var(--pink);color:#fff;font-size:11px;font-weight:900;line-height:19px;padding:0 5px}
.badge:empty{display:none}

/* тости */
.toasts{position:fixed;left:0;right:0;top:calc(8px + env(safe-area-inset-top));z-index:8;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding:0 14px}
.toast{max-width:420px;background:#fff;color:#22113f;border-radius:16px;padding:10px 14px;font-size:15px;font-weight:700;box-shadow:0 8px 24px #0008;animation:tin .25s ease-out}
.toast.me{background:linear-gradient(90deg,var(--pink),var(--pink2));color:#fff}
@keyframes tin{from{transform:translateY(-10px);opacity:0}}

/* шторки і вікна */
.sheet,.over{position:fixed;inset:0;z-index:7;display:flex;align-items:flex-end;justify-content:center;background:#000a}
.over{align-items:center;z-index:9;padding:16px}
.sheetbox{width:100%;max-width:460px;max-height:86vh;overflow:auto;background:#22143f;border:1px solid var(--line);border-radius:26px 26px 0 0;
  padding:16px 16px calc(16px + env(safe-area-inset-bottom));animation:sup .22s ease-out}
.over .sheetbox{border-radius:26px;padding-bottom:16px;animation:none}
@keyframes sup{from{transform:translateY(40px);opacity:.4}}
.grab{width:42px;height:5px;border-radius:3px;background:#ffffff33;margin:-4px auto 12px}
.sheetbox h2{font-size:21px;font-weight:900;margin-bottom:6px}
.sheetbox p{font-size:15px;color:var(--muted);margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.gift{padding:14px 6px;border-radius:18px;background:var(--card2);border:1px solid var(--line)}
.gift b{display:block;font-size:34px;font-weight:400}
.gift span{display:block;font-size:15px;font-weight:700;margin-top:2px}
.gift i{display:block;font-size:13px;font-style:normal;color:var(--gold);margin-top:3px;font-weight:700}
.gift.free{background:linear-gradient(160deg,#ff5fa244,#ff8a5c22);border-color:var(--pink)}
.who{padding:14px 8px;border-radius:16px;background:var(--card2);border:1px solid var(--line);font-size:16px;font-weight:700}
.menu{display:flex;flex-direction:column;gap:8px}
.menu button{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:var(--card2);border:1px solid var(--line);font-size:16px;font-weight:700;text-align:left}
.menu button b{font-size:24px;font-weight:400;width:30px;text-align:center}
.menu button span{flex:1}
.menu button i{font-style:normal;font-size:13px;color:var(--gold)}
.close{width:100%;margin-top:12px;padding:13px;border-radius:16px;font-size:16px;font-weight:700;background:transparent;border:1px solid var(--line);color:var(--muted)}
.ovbtn{width:100%;margin-top:8px;padding:15px;border-radius:16px;font-size:17px;font-weight:800;background:linear-gradient(90deg,var(--pink),var(--pink2));color:#fff}
.ovbtn.sec{background:var(--card2);border:1px solid var(--line)}
.steps{display:flex;flex-direction:column;gap:10px;text-align:left;margin:6px 0 4px}
.step{display:flex;gap:12px;align-items:center;padding:12px;border-radius:16px;background:var(--card2)}
.step b{font-size:30px;font-weight:400}
.step span{font-size:16px;font-weight:600}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:4px 0 12px}
.day{padding:7px 1px;border-radius:10px;background:var(--card2);font-size:10px;color:var(--faint);line-height:1.3}
.day b{display:block;font-size:12px;color:#fff;font-weight:400;margin-top:2px}
.day.done{opacity:.45}
.day.now{background:#fff;color:#2a124e}
.day.now b{color:#2a124e}

/* чат і стрічка */
.feed{height:46vh;overflow-y:auto;text-align:left;padding:4px 2px;display:flex;flex-direction:column;gap:6px}
.feed div{padding:8px 11px;border-radius:14px;background:var(--card2);font-size:15px;line-height:1.35;align-self:flex-start;max-width:92%}
.feed div.sys{background:transparent;color:var(--faint);font-size:13px;padding:2px 4px;align-self:center;text-align:center}
.feed div.me{border:1px solid var(--pink)}
.feed b{font-weight:800}
.feed b.m{color:#9cc8ff}.feed b.f{color:#ffb0d0}
.feed .empty{background:transparent;color:var(--faint);align-self:center}
.chatf{display:flex;gap:8px;margin-top:10px}
.chatf input{flex:1;min-width:0;padding:13px;border-radius:14px;border:2px solid #ffffff33;background:#0006;color:#fff;font-size:16px;font-family:inherit}
.chatf input:focus{outline:none;border-color:var(--pink)}
.chatf button{padding:0 18px;border-radius:14px;background:linear-gradient(90deg,var(--pink),var(--pink2));font-size:20px;font-weight:900}
.wishcard{text-align:left}
.wishcard .w{font-size:19px;font-weight:700;margin:4px 0 8px}
.ans{margin-top:8px;padding:10px 12px;border-radius:14px;background:var(--card2);font-size:16px;display:flex;gap:8px;align-items:center}
.ans span{flex:1}
.ans b{color:var(--gold)}
.pick{padding:8px 12px;border-radius:12px;background:var(--gold);color:#2a124e;font-weight:900;font-size:14px}
</style>
</head>
<body>
<div class="toasts" id="toasts"></div>
<div class="wrap">
  <div class="top">
    <h1 data-t="🍾 Гра в бутилочку">🍾 Гра в бутилочку</h1>
    <span class="chip" id="count">👥 0/10</span>
    <button class="help" id="helpBtn" aria-label="?">?</button>
  </div>
  <div class="event hidden" id="eventBar"></div>

  <div class="table" id="table">
    <svg id="bottle" viewBox="0 0 60 200" aria-hidden="true">
      <defs>
        <linearGradient id="glass" x1="0" x2="1">
          <stop offset="0" stop-color="#1f7a4d"/><stop offset=".45" stop-color="#43c17f"/><stop offset="1" stop-color="#155c39"/>
        </linearGradient>
      </defs>
      <rect x="23" y="0" width="14" height="18" rx="4" fill="#ffd166"/>
      <path d="M24 18 H36 V62 C36 76 55 86 55 116 V188 C55 195 49 200 42 200 H18 C11 200 5 195 5 188 V116 C5 86 24 76 24 62 Z" fill="url(#glass)" stroke="#ffffff66" stroke-width="2"/>
      <rect x="12" y="122" width="36" height="44" rx="6" fill="#fff"/>
      <text x="30" y="150" text-anchor="middle" font-size="18">💋</text>
      <path d="M13 110 C13 96 20 88 24 82" stroke="#ffffffaa" stroke-width="4" fill="none" stroke-linecap="round"/>
    </svg>
  </div>

  <div class="stage" id="stage"></div>
</div>

<nav class="tabbar">
  <div class="in">
    <button class="tab" id="tabGift"><b>🎁</b><span data-t="Подарунок">Подарунок</span><i class="badge" id="badgeGift"></i></button>
    <button class="tab" id="tabWish"><b>✨</b><span data-t="Бажання">Бажання</span><i class="badge" id="badgeWish"></i></button>
    <button class="tab" id="tabChat"><b>💬</b><span data-t="Чат">Чат</span><i class="badge" id="badgeChat"></i></button>
    <button class="tab" id="tabMore"><b>☰</b><span data-t="Ще">Ще</span><i class="badge" id="badgeMore"></i></button>
  </div>
</nav>

<div class="sheet hidden" id="sheet">
  <div class="sheetbox">
    <div class="grab"></div>
    <h2 id="sheetTitle"></h2>
    <p id="sheetText"></p>
    <div id="sheetBody"></div>
    <button class="close" id="sheetClose" data-t="Закрити">Закрити</button>
  </div>
</div>

<div class="over hidden" id="over">
  <div class="sheetbox">
    <h2 id="overTitle"></h2>
    <p id="overText"></p>
    <div id="overBtns"></div>
  </div>
</div>

<script>

  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },

};

function guessLang(code) {
  const c = String(code || "").toLowerCase();
  if (c.startsWith("uk") || !c) return "uk";
  if (["ru", "be", "kk", "ky", "uz", "tg", "hy", "az"].some((x) => c.startsWith(x))) return "ru";
  return "en";
}
let LANG = (() => { try { return guessLang(tg.initDataUnsafe.user.language_code); } catch (e) { return "uk"; } })();
function T(key, ...args) {
  const s = (I18N[LANG] && I18N[LANG][key]) || key;
  return s.replace(/\{(\d)\}/g, (_, n) => (args[n] !== undefined ? args[n] : ""));
}
function applyLang() {
  document.documentElement.lang = LANG;
  document.title = T("Гра в бутилочку");
  document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = T(el.dataset.t); });
  renderStage();
  updateBadges();
}

/* ---------- стан ---------- */
const N = 10;
const CAT_NAMES = { truth: "ПРАВДА", action: "ДІЯ", kiss: "ПОЦІЛУНОК", adult: "18+" };
const CATS = [["all", "🎲 Усе"], ["truth", "💬 Правда"], ["action", "🔥 Дія"], ["kiss", "💋 Цьом"], ["adult", "🔞 18+"]];
const S = { wallet: { roses: 0, aims: 0 }, seat: -1, players: [], turn: -1, phase: "wait", spinner: -1, pair: null, task: null, gifts: [], selected: "all", myChoice: null, fatal: false, last: null, unread: 0, wish: null, doubleUntil: 0 };
const FACE = { m: "👨", f: "👩" };
const giftHearts = (stars) => Math.max(1, Math.round(stars / 5));
let ws = null;
let rot = 0;
const send = (m) => { if (ws && ws.readyState === 1) ws.send(JSON.stringify(m)); };

/* ---------- стіл ---------- */
const seatEls = [];
for (let i = 0; i < N; i++) {
  const el = document.createElement("div");
  el.className = "seat empty";
  el.innerHTML = '<div class="av"></div><div class="nm"></div><span class="hb"></span><span class="crown"></span><span class="gb"></span>';
  el.addEventListener("click", () => openGift(i));
  $("table").appendChild(el);
  seatEls.push(el);
}
// Ти завжди внизу столу.
const angleOf = (i) => ((i - S.seat + N) % N) / N * 360 + 180;
// Боти завжди позначені «· бот» — щоб ніхто не плутав їх із людьми.
const label = (p) => (p ? p.name + (p.bot ? " · " + T("бот") : "") : T("Хтось"));
const nameOf = (i) => label(S.players[i]);
const others = () => S.players.map((p, i) => (p && i !== S.seat ? i : -1)).filter((i) => i >= 0);
// Подарунки, 🎯 і бажання — лише для людей.
const people = () => others().filter((i) => !S.players[i].bot);
const botNote = () => toast(T("Це бот — подарунки, 🎯 і «наодинці» діють лише на людей."));

function renderTable() {
  const top = Math.max(0, ...S.players.map((p) => (p && !p.bot ? p.hearts || 0 : 0)));
  seatEls.forEach((el, i) => {
    const p = S.players[i];
    const a = angleOf(i) * Math.PI / 180;
    el.style.left = 50 + 40 * Math.sin(a) + "%";
    el.style.top = 50 - 40 * Math.cos(a) + "%";
    const active = (S.phase === "idle" && i === S.turn) || (S.phase === "spin" && i === S.spinner);
    const inRound = (S.pair && S.pair.includes(i)) || (S.task && (S.task.target === i || S.task.spinner === i));
    el.className = "seat" + (p ? "" : " empty") + (p && p.g ? " " + p.g : "") + (i === S.seat ? " me" : "") + (active ? " turn" : "") + (inRound ? " paired" : "");
    el.querySelector(".av").textContent = p ? FACE[p.g] || "🙂" : "";
    el.querySelector(".nm").textContent = p ? (p.bot ? label(p) : p.name + (p.age ? ", " + p.age : "")) : "";
    el.querySelector(".hb").textContent = p && p.hearts ? "❤" + p.hearts : "";
    el.querySelector(".crown").textContent = p && !p.bot && top > 0 && p.hearts === top ? "👑" : "";
    el.querySelector(".gb").textContent = p && p.badge ? p.badge : "";
  });

function fly(seat, emoji) {

/* ---------- сцена: лише те, що треба зробити зараз ---------- */
const h = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
function taskCard(category, text, answer) {
  const c = h("div", "task");
  c.append(h("div", "tag", T(CAT_NAMES[category] || "ЗАВДАННЯ")), h("div", "q", text));
  if (answer !== undefined) c.appendChild(h("div", "a", answer ? "«" + answer + "»" : "🤐"));
  return c;
}
let draft = "";
function renderStage() {
  const st = $("stage");
  const keep = st.querySelector("textarea");
  if (keep) draft = keep.value;
  st.replaceChildren();
  const me = S.seat;
  const n = S.players.filter(Boolean).length;

  if (S.seat < 0) {
    st.append(h("div", "title", T("Підключення до столу...")));
  } else if (S.phase === "wait" || n < 2) {
    st.append(h("div", "title", T("Чекаємо гравців...")), h("div", "sub", T("Для гри потрібно хоча б двоє. Поклич друзів — за кожного отримаєш Premium.")));
    const b = h("button", "big", T("📨 Покликати друга за стіл"));
    b.addEventListener("click", share);
    st.append(b);
  } else if (S.phase === "idle" && S.turn === me) {
    st.append(h("div", "title", T("Твоя черга!")), h("div", "sub", T("Обери тему й крути пляшку")));
    const cats = h("div", "cats");
    CATS.forEach(([id, label]) => {
      const c = h("button", "cat" + (S.selected === id ? " on" : ""), T(label));
      c.addEventListener("click", () => { S.selected = id; buzz("selectionChanged"); renderStage(); });
      cats.appendChild(c);
    });
    const b = h("button", "big", T("🍾 КРУТИТИ"));
    b.addEventListener("click", () => { b.disabled = true; send({ type: "spin", selected: S.selected }); });
    st.append(cats, b);
  } else if (S.phase === "idle") {
    st.append(h("div", "title", T("Зараз крутить {0}", nameOf(S.turn))), h("div", "sub", T("Тапни на гравця, щоб подарувати подарунок")));
    if (S.last) st.append(S.last());
  } else if (S.phase === "spin") {
    st.append(h("div", "title", T("Пляшка крутиться...")), h("div", "sub", T("На кого ж вона покаже? 👀")));
  } else if (S.phase === "answer" && S.task) {
    const mine = S.task.target === me;
    if (mine && !S.sent) {
      st.append(h("div", "title", T("Твоє завдання!")), h("div", "sub", T("Від {0}", nameOf(S.task.spinner))), taskCard(S.task.category, S.task.text));
      const ta = h("textarea"); ta.rows = 3; ta.maxLength = 200; ta.placeholder = T("Твоя відповідь..."); ta.value = draft;
      const go = h("button", "big", T("Відповісти"));
      go.addEventListener("click", () => {
        const text = ta.value.trim();
        if (!text) { ta.focus(); return; }
        send({ type: "answer", text }); S.sent = true; draft = ""; renderStage();
      });
      const skip = h("button", "soft", T("Пропустити 🤐"));
      skip.addEventListener("click", () => { send({ type: "answer", skip: true }); S.sent = true; draft = ""; renderStage(); });
      st.append(ta, go, skip);
    } else {
      st.append(h("div", "title", T("{0} відповідає на завдання…", nameOf(S.task.target))), taskCard(S.task.category, S.task.text));
    }
  } else if (S.phase === "pair" && S.pair) {
    const inPair = S.pair.includes(me);
    if (inPair) {
      // Головна дія — вибір пари, тому кнопки вгорі, а відповідь під ними.
      const other = S.pair.find((s) => s !== me);
      st.append(h("div", "title", T("💞 Ви в парі з {0}. Що далі?", nameOf(other))));
      const row = h("div", "choices");
      [["kiss", "💋", "Поцілувати"], ["push", "👋", "Відштовхнути"], ["alone", "🔒", "Наодинці"]].forEach(([id, em, label]) => {
        const b = h("button", id + (S.myChoice === id ? " on" : ""));
        b.append(h("b", "", em), h("span", "", T(label)));
        // З ботом «наодинці» неможливе — кнопку вимикаємо.
        b.disabled = Boolean(S.myChoice) || (id === "alone" && S.players[other] && S.players[other].bot);
        b.addEventListener("click", () => { if (S.myChoice) return; S.myChoice = id; send({ type: "pair", choice: id }); buzz("impactOccurred", "medium"); renderStage(); });
        row.appendChild(b);
      });
      const withBot = S.players[other] && S.players[other].bot;
      st.append(row, h("div", "sub", S.myChoice ? T("Чекаємо, що обере {0}...", nameOf(other)) : withBot ? T("Це бот: «Наодинці» з ним недоступне.") : T("«Наодинці» — приватний чат у боті, якщо обоє його оберуть.")));
      if (S.last) st.append(S.last());
    } else {
      st.append(h("div", "title", T("Пара {0} обирає…", T("{0} і {1}", nameOf(S.pair[0]), nameOf(S.pair[1])))));
      if (S.last) st.append(S.last());
    }
  }

  // Бажання за столом — помітна смужка.
  if (S.wish) {
    const mine = S.wish.from === me;
    const b = h("button", "wishstrip", mine ? T("✨ Твоє бажання: відповідей {0}", S.wish.answers.length) : T("✨ {0} загадав(ла) бажання — виконай і отримай 👑", nameOf(S.wish.from)));
    b.addEventListener("click", openWish);
    st.appendChild(b);
  }
}

// Остання відповідь із реакціями (показується до наступного оберту).

/* ---------- повідомлення від сервера ---------- */
function handle(m) {
  if (m.type === "hello") {
    if (I18N[m.lang] || m.lang === "uk") LANG = m.lang;
    S.bot = m.bot || "";
    S.invite = m.invite || "";
    applyLang();
  } else if (m.type === "joined") {
    S.seat = m.seat;
    S.gifts = m.gifts || [];
    hideOver();
    if (!store.get("howto")) showHowTo();
  } else if (m.type === "need_gender") {
    showOver(T("Хто ти?"), T("Так за столом видно, хто хлопець, а хто дівчина. Збережемо в анкету, більше не питатимемо."), [
      [T("👨 Я хлопець"), () => { send({ type: "gender", gender: "Чоловік" }); hideOver(); }],
      [T("👩 Я дівчина"), () => { send({ type: "gender", gender: "Жінка" }); hideOver(); }],
    ]);
  } else if (m.type === "table") {
    const wasMyTurn = S.phase === "idle" && S.turn === S.seat;
    S.players = m.players;
    S.task = m.task || null;
    S.turn = m.turn;
    S.phase = m.phase;
    S.pair = m.pair;
    if (m.phase !== "pair") S.myChoice = null;
    renderTable();
    renderStage();
    if (!wasMyTurn && S.phase === "idle" && S.turn === S.seat) buzz("notificationOccurred", "success");
  } else if (m.type === "spin_start") {
    S.phase = "spin";
    S.spinner = m.spinner;
    S.pair = null;
    S.myChoice = null;
    S.last = null;
    const cur = ((rot % 360) + 360) % 360;
    rot += m.turns * 360 + ((((angleOf(m.target) - cur) % 360) + 360) % 360);
    const bottle = $("bottle");
    bottle.style.transition = "transform " + m.duration + "ms cubic-bezier(.12,.72,.18,1)";
    bottle.style.transform = "translate(-50%,-50%) rotate(" + rot + "deg)";
    renderTable();
    renderStage();
    buzz("impactOccurred", "medium");
  } else if (m.type === "spin_result") {
    S.sent = false;
    S.phase = "answer";
    S.spinner = m.spinner;
    S.pair = [m.spinner, m.target];
    renderTable();
    renderStage();
    addFeed(T(m.target === S.seat ? "🍾 {0} → {1} (це ти!)" : "🍾 {0} → {1} · чекаємо відповідь", nameOf(m.spinner), nameOf(m.target)), m.target === S.seat, { quiet: m.target !== S.seat });
    buzz("notificationOccurred", "success");
  } else if (m.type === "answer") {
    showAnswer(m);
  } else if (m.type === "react") {
    fly(m.to, m.emoji);
    addFeed(m.emoji + " " + nameOf(m.from) + " → " + nameOf(m.to), m.to === S.seat, { quiet: m.to !== S.seat });
    if (m.to === S.seat) buzz("notificationOccurred", "success");
  } else if (m.type === "chat") {
    addFeed(m.text, false, { chat: true, seat: m.seat });
  } else if (m.type === "pair_done") {
    const pair = T("{0} і {1}", nameOf(m.a), nameOf(m.b));
    let line = { alone: T("🔒 {0} пішли побути наодинці", pair), kiss: T("💋 {0} поцілувались (+1 ❤ кожному)", pair), busy: T("🔒 Не вийшло: хтось уже в іншому діалозі"), none: T("🤷 {0} розгубились", pair) }[m.outcome];
    if (m.outcome === "push") {
      line = m.ca === "push" && m.cb === "push" ? T("👋 {0} відштовхнули одне одного", pair)
        : T("👋 {0} відштовхнув(ла) {1}", nameOf(m.ca === "push" ? m.a : m.b), nameOf(m.ca === "push" ? m.b : m.a));
    }
    if (m.outcome === "kiss") { fly(m.a, "💋"); fly(m.b, "💋"); if (m.a === S.seat || m.b === S.seat) inviteNudge(); }
    if (m.outcome === "push") fly(m.ca === "push" ? m.b : m.a, "💔");
    addFeed(line, m.a === S.seat || m.b === S.seat);
    // Хотів(ла) більшого, а не вийшло — пропонуємо подарунок із запрошенням.
    if ((m.a === S.seat || m.b === S.seat) && m.outcome !== "alone") {
      const mine = m.a === S.seat ? m.ca : m.cb;
      const other = m.a === S.seat ? m.b : m.a;
      const wanted = mine === "alone" || (m.outcome === "push" && mine && mine !== "push");
      if (wanted && S.players[other] && !S.players[other].bot) {
        const nm = nameOf(other);
        setTimeout(() => showOver(T(m.outcome === "push" ? "💔 {0} тебе відштовхнув(ла)" : "🔒 {0} поки не готовий(а) наодинці", nm),
          T("Розтопи серце подарунком: {0} отримає його разом із запрошенням побути з тобою наодинці.", nm), [
            [T("🎁 Подарувати {0}", nm), () => { hideOver(); openGift(other); }],
            [T("Пізніше"), hideOver],
          ]), 700);
      }
    }
  } else if (m.type === "chat_opened") {
    S.pair = null;
    showOver(T("🔒 Ви наодинці"), T("Пиши співрозмовнику в чаті з ботом. Гру можна закрити, а потім повернутись за стіл."), [
      [T("Закрити гру"), () => { try { tg.close(); } catch (e) { hideOver(); } }],
      [T("Повернутись за стіл"), () => { send({ type: "join" }); hideOver(); }],
    ]);
  } else if (m.type === "gift") {
    const from = m.from >= 0 ? nameOf(m.from) : T("Хтось");
    addFeed("🎁 " + from + " → " + nameOf(m.to) + ": " + m.gift.emoji + " " + m.gift.name + " (+" + (m.hearts || 1) + " ❤)", m.to === S.seat);
    fly(m.to, m.gift.emoji);
    if (m.to === S.seat) buzz("notificationOccurred", "success");
  } else if (m.type === "gift_invite") {
    const nm = nameOf(m.from);
    showOver(T("🎁 {0} дарує тобі {1}", nm, m.gift.emoji + " " + m.gift.name), T("{0} запрошує тебе побути наодинці: це приватний чат у боті, без імен і контактів.", nm), [
      [T("🔒 Побути наодинці"), () => { send({ type: "invite", yes: true }); hideOver(); }],
      [T("Дякую, лишусь за столом"), () => { send({ type: "invite", yes: false }); hideOver(); }],
    ]);
  } else if (m.type === "wallet") {
    S.wallet = { roses: m.roses || 0, aims: m.aims || 0 };
    updateBadges();
  } else if (m.type === "daily") {
    showDaily(m);
  } else if (m.type === "daily_done") {
    addFeed(T("🎁 Щоденна винагорода, день {0}: {1}", m.day, rewardText(m.reward)), true);
    fly(S.seat, "🎁");
    buzz("notificationOccurred", "success");
  } else if (m.type === "wish") {
    const had = Boolean(S.wish);
    S.wish = m.wish ? { ...m.wish, endsAt: Date.now() + m.wish.left } : null;
    if (S.wish && !had && S.wish.from !== S.seat) toast(T("✨ {0} загадав(ла) бажання — виконай і отримай 👑", nameOf(S.wish.from)), true);
    updateBadges();
    renderStage();
    if (wishOpen && !$("sheet").classList.contains("hidden")) openWish();
  } else if (m.type === "wish_done") {
    S.wish = null;
    if (wishOpen) closeSheet();
    updateBadges();
    renderStage();
    if (m.to >= 0) {
      addFeed(T("👑 {0} виконав(ла) бажання {1} і отримує Корону бажань!", nameOf(m.to), nameOf(m.from)), m.to === S.seat);
      fly(m.to, "👑");
      if (m.to === S.seat) { buzz("notificationOccurred", "success"); inviteNudge(); }
    } else addFeed(T("✨ Бажання {0} ніхто не виконав — зірки повернуто.", nameOf(m.from)), m.from === S.seat);
  } else if (m.type === "event") {
    S.doubleUntil = Date.now() + Math.max(0, m.doubleUntil - m.now);
    renderEvent();
  } else if (m.type === "aim_set") {
    addFeed(T("🎯 Наступного твого ходу пляшка покаже на {0}", nameOf(m.to)), true);
    buzz("notificationOccurred", "success");
  } else if (m.type === "notice") {
    addFeed(m.text);
  } else if (m.type === "invoice") {
    if (tg && tg.openInvoice) {
      tg.openInvoice(m.link, (st) => addFeed(T(st === "paid" ? "✅ Оплачено, подарунок летить" : st === "cancelled" ? "Оплату скасовано" : "Оплата не пройшла"), st === "paid"));
    } else addFeed(T("Відкрий гру з Telegram, щоб оплатити."));
  } else if (m.type === "error") {
    if (m.code === "need_start") {
      S.fatal = true;
      showOver(T("Спершу в бота"), m.message, [[T("Закрити"), () => { try { tg.close(); } catch (e) {} }]]);
    } else addFeed(m.message || T("Помилка гри"));
  }
}

/* ---------- підключення ---------- */
function connect() {
  const initData = tg && tg.initData;
  if (!initData) {
    S.fatal = true;
    showOver(T("Відкрий через Telegram"), T("Ця гра працює лише всередині бота."), []);
    return;
  }
  hideOver();
  ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/game?initData=" + encodeURIComponent(initData));
  ws.addEventListener("message", (e) => { let m; try { m = JSON.parse(e.data); } catch (err) { return; } handle(m); });
  ws.addEventListener("close", (e) => {
    if (S.fatal) return;
    S.phase = "wait";
    showOver(T("З'єднання втрачено"), T(e.code === 4001 ? "Гру відкрито в іншому вікні." : "Перевір інтернет і підключись знову."), [[T("Підключитись знову"), connect]]);
  });
}

applyLang();
renderTable();
connect();
</script>
